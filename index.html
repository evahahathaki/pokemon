<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should I Evolve This Pokémon?</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Legendary Pokemon Background Overlay with Intense Red Glow */
      background: linear-gradient(135deg, rgba(139, 0, 0, 0.88), rgba(20, 0, 5, 0.92)), 
                  url('https://images.alphacoders.com/605/thumb-1920-605282.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      padding: 20px;
    }

    .card {
      background: rgba(25, 5, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid #ff2a2a;
      border-radius: 28px;
      padding: 40px 30px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.6), inset 0 0 15px rgba(255, 0, 0, 0.3);
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ff4d4d, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    p.subtitle { font-size: 14px; color: #ff9999; margin-bottom: 25px; font-weight: 600; }

    select {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      border: 2px solid #ff3333;
      background: #1a0306;
      color: #fff;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
    }

    select:hover, select:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
    }

    .result-badge {
      font-size: 22px;
      font-weight: 900;
      padding: 12px 24px;
      border-radius: 50px;
      display: inline-block;
      margin-bottom: 25px;
      letter-spacing: 1px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .yes { background: rgba(34, 197, 94, 0.25); color: #4ade80; border: 2px solid #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    .no { background: rgba(239, 68, 68, 0.25); color: #ff6b6b; border: 2px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

    .flex-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .poke-box {
      background: rgba(40, 8, 12, 0.8);
      border-radius: 20px;
      padding: 18px;
      width: 45%;
      min-width: 190px;
      border: 1px solid rgba(255, 80, 80, 0.3);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .poke-box.single { width: 80%; margin: 0 auto; }

    .poke-box img {
      width: 130px;
      height: 130px;
      filter: drop-shadow(0 12px 18px rgba(255, 0, 0, 0.3));
      transition: transform 0.3s ease;
    }

    .poke-box img:hover { transform: scale(1.18) rotate(4deg); }

    .poke-name {
      font-size: 19px;
      font-weight: 800;
      text-transform: capitalize;
      margin: 8px 0;
      color: #ffcc00;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }

    .arrow {
      font-size: 32px;
      color: #ffcc00;
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
      animation: pulse 1.5s infinite;
    }

    /* Stat Bars */
    .stat-group { text-align: left; margin-top: 12px; font-size: 12px; }
    .stat-label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #ffcccc; font-weight: 700; }
    .bar-bg { background: #2a0a0f; height: 10px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease-out; }
    .hp-fill { background: linear-gradient(90deg, #16a34a, #4ade80); }
    .atk-fill { background: linear-gradient(90deg, #dc2626, #ff4d4d); }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Pokemon Evolver</h1>
    <p class="subtitle">Should I evolve this Pokémon?</p>
    
    <select id="pokemonSelect">
      <option value="">Loading Pokémon data...</option>
    </select>

    <div id="output"></div>
  </div>

  <script>
    let pokemonData = [];

    Papa.parse('pokemon.csv', {
      download: true,
      header: true,
      complete: function(results) {
        pokemonData = results.data.filter(p => p.pokemon && p.pokemon.trim() !== '');
        populateDropdown();
      }
    });

    function populateDropdown() {
      const select = document.getElementById('pokemonSelect');
      select.innerHTML = '<option value="">-- Select a Pokémon (A-Z) --</option>';

      // Sort Alphabetically
      const sorted = [...pokemonData].sort((a, b) => a.pokemon.localeCompare(b.pokemon));

      sorted.forEach(p => {
        const option = document.createElement('option');
        option.value = p.species_id;
        option.textContent = p.pokemon.charAt(0).toUpperCase() + p.pokemon.slice(1);
        select.appendChild(option);
      });
    }

    document.getElementById('pokemonSelect').addEventListener('change', function() {
      const speciesId = this.value;
      const output = document.getElementById('output');
      if (!speciesId) { output.innerHTML = ''; return; }

      const selected = pokemonData.find(p => p.species_id === speciesId);
      const evolution = pokemonData.find(p => p.evolves_from_species_id === speciesId);

      if (evolution) {
        output.innerHTML = `
          <div class="result-badge yes">YES! EVOLVE IT ⚡</div>
          <div class="flex-container">
            ${createPokeCard(selected)}
            <div class="arrow">➔</div>
            ${createPokeCard(evolution)}
          </div>
        `;
      } else {
        output.innerHTML = `
          <div class="result-badge no">NO EVOLUTION AVAILABLE 🚫</div>
          <p style="margin-bottom: 15px; color: #ff9999; font-size: 13px;">This Pokémon has reached its final stage or does not evolve.</p>
          <div class="flex-container">
            ${createPokeCard(selected, true)}
          </div>
        `;
      }
    });

    function createPokeCard(p, isSingle = false) {
      const hpWidth = Math.min((parseInt(p.hp) / 150) * 100, 100);
      const atkWidth = Math.min((parseInt(p.attack) / 150) * 100, 100);

      return `
        <div class="poke-box ${isSingle ? 'single' : ''}">
          <p class="poke-name">${p.pokemon}</p>
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.species_id}.png" 
               onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.species_id}.png'" 
               alt="${p.pokemon}">
          
          <div class="stat-group">
            <div class="stat-label"><span>HP</span><span>${p.hp}</span></div>
            <div class="bar-bg"><div class="bar-fill hp-fill" style="width: ${hpWidth}%;"></div></div>
            
            <div class="stat-label"><span>Attack</span><span>${p.attack}</span></div>
            <div class="bar-bg"><div class="bar-fill atk-fill" style="width: ${atkWidth}%;"></div></div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
